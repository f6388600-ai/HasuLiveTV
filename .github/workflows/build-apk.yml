name: Build Hasu Live TV APKs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept licenses and install SDK
        run: |
          sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"
      - name: Build all debug APKs
        run: ./gradlew --no-daemon assembleMobileDebug assembleTvDebug assembleAdminDebug
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hasu-live-tv-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
